# Builds a debug APK you can install on any Android phone, and (once you add signing secrets) a release bundle for Google Play.
# Run it from the GitHub "Actions" tab -> "Android build" -> "Run workflow". Free for public repos; private repos get free monthly minutes.
name: Android build
on: { workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Stage web files
        run: |
          mkdir www && cp -r index.html sw.js manifest.webmanifest vendor icons fonts www/
      - run: npm install
      - name: Create Android project (first run only)
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Use the Purrfect Home logo as the app icon and launch screen
        run: |
          RES=android/app/src/main/res
          cp -r android-icons/* $RES/
          rm -f $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          rm -f $RES/drawable-land*/splash.png $RES/drawable-port*/splash.png
          mkdir -p $RES/values $RES/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#2E7658</color></resources>\n' > $RES/values/ic_launcher_background.xml
          for n in ic_launcher ic_launcher_round; do printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$n.xml; done
      - name: Allow vibration (haptics)
        run: grep -q VIBRATE android/app/src/main/AndroidManifest.xml || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml
      - name: Notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,13c-2.8,0 -5,2.2 -5,4.5c0,1.6 1.3,2.5 2.8,2.5c1,0 1.5,-0.4 2.2,-0.4s1.2,0.4 2.2,0.4c1.5,0 2.8,-0.9 2.8,-2.5C17,15.2 14.8,13 12,13zM6.5,9.5m-2,0a2,2.5 0,1 1,4 0a2,2.5 0,1 1,-4 0M10,5.5m-2,0a2,2.5 0,1 1,4 0a2,2.5 0,1 1,-4 0M14,5.5m-2,0a2,2.5 0,1 1,4 0a2,2.5 0,1 1,-4 0M17.5,9.5m-2,0a2,2.5 0,1 1,4 0a2,2.5 0,1 1,-4 0"/></vector>\n' > android/app/src/main/res/drawable/ic_stat_purrfect.xml
      - name: Allow notifications
        run: grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml
      - name: Use the fixed debug signing key (so every build installs over the last one)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Give every build a higher version number (Android refuses to update over a build with the same or newer one)
        run: sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "0.${{ github.run_number }}"/' android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: purrfect-home-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
